<!DOCTYPE HTML>

<!--
Page footer for PDF output (wkhtmltopdf --footer-html): classification in the middle,
"page / pages" on the right. Same content as the footer of reference.dotx.

wkhtmltopdf passes values in the query string; elements with these classes get them:
page, topage, frompage, webpage, section, subsection, subsubsection, title, doctitle
-->

<html>
<head>
<meta charset="utf-8">
<script>
  function subst() {
    var vars = {};
    var x = window.location.search.substring(1).split('&');
    for (var i in x) { var z = x[i].split('=', 2); vars[z[0]] = unescape(z[1]); }
    var names = ['page', 'topage'];
    for (var i in names) {
      var y = document.getElementsByClassName(names[i]);
      for (var j = 0; j < y.length; ++j) y[j].textContent = vars[names[i]];
    }
  }
</script>
</head>

<body style="border:0; margin:0; font-family: Verdana, Arial, sans-serif; font-size: 10pt; color: #444;" onload="subst()">
<div style="padding-top:1em;">
<table style="border-top: 1px solid #999; width: 100%; border-collapse: collapse;">
  <tr>
    <td style="width:25%"></td>
    <td style="width:50%; text-align:center; padding-top:4px;">GRAID Confidential</td>
    <td style="width:25%; text-align:right; padding-top:4px;"><span class="page"></span> / <span class="topage"></span></td>
  </tr>
</table>
</div>
</body></html>
