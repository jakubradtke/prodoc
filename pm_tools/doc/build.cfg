# prodoc build configuration for this documentation folder (Python syntax).
# mmd2doc.py looks for build.cfg upwards from the document folder.
# See README.md, "Symbols, conditional text and variants".

# Releases in order: makes RELEASE comparable (RELEASE >= "2.0")
releases = ["1.0", "2.0"]

# Symbols for every document under this folder ({{NAME}} and <!--if:NAME-->)
symbols = {
    "PRODUCT": "prodoc",
    "AUDIENCE": "public",
}

# Named sets of symbols; a document lists the variants it is built for
# under "variants:" in its YAML header, output is <doc>.<variant>.html
variants = {
    "internal": {"AUDIENCE": "internal"},
    "v1": {"RELEASE": "1.0"},
    "v2": {"RELEASE": "2.0"},
}
